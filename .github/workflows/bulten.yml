name: Bugün Samsun

on:
  schedule:
    # GitHub cron is UTC; Türkiye is UTC+3 all year. GitHub may delay or silently drop a scheduled
    # run, so each edition has three triggers. Runs queue one at a time; once the bulletin is out,
    # the later ones see it on the account (and in data/state.json) and exit without posting.
    - cron: "7 4 * * *"    # 07:07 → Gündem, published 08:00
    - cron: "23 4 * * *"   # 07:23 → Gündem (backup)
    - cron: "41 4 * * *"   # 07:41 → Gündem (backup)
    - cron: "37 8 * * *"   # 11:37 → Ekonomi & İş, published 12:30
    - cron: "53 8 * * *"   # 11:53 → Ekonomi & İş (backup)
    - cron: "11 9 * * *"   # 12:11 → Ekonomi & İş (backup)
    - cron: "7 15 * * *"   # 18:07 → Spor, published 19:00
    - cron: "23 15 * * *"  # 18:23 → Spor (backup)
    - cron: "41 15 * * *"  # 18:41 → Spor (backup)
  workflow_dispatch:
    inputs:
      edition:
        description: "Bülten"
        type: choice
        options: [gundem, ekonomi, spor]
        default: gundem
      publish:
        description: "Instagram'a gönder (kapalıysa yalnızca görselleri hazırlar)"
        type: boolean
        default: false
      force:
        description: "Bugün zaten yayınlandıysa yine de gönder"
        type: boolean
        default: false
      sample:
        description: "Şablon testi: örnek içerikle görsel üret (yapay zekâ ve yayın yok)"
        type: boolean
        default: false
      check:
        description: "Bağlantı kontrolü: Instagram ve yapay zekâ anahtarlarını dene (hiçbir şey yayınlamaz)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bugun-samsun
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest state, not the commit this run was queued on (a queued backup must see the earlier post)

      - name: Choose edition
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "7 4 * * *"|"23 4 * * *"|"41 4 * * *")
              echo "edition=gundem"  >> "$GITHUB_OUTPUT"; echo "flags=--publish --wait" >> "$GITHUB_OUTPUT" ;;
            "37 8 * * *"|"53 8 * * *"|"11 9 * * *")
              echo "edition=ekonomi" >> "$GITHUB_OUTPUT"; echo "flags=--publish --wait" >> "$GITHUB_OUTPUT" ;;
            "7 15 * * *"|"23 15 * * *"|"41 15 * * *")
              echo "edition=spor"    >> "$GITHUB_OUTPUT"; echo "flags=--publish --wait" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "edition=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
              flags=""
              if [ "${{ inputs.publish }}" = "true" ]; then flags="--publish"; fi
              if [ "${{ inputs.force }}" = "true" ]; then flags="$flags --force"; fi
              if [ "${{ inputs.sample }}" = "true" ]; then flags="--issue samples/${{ inputs.edition }}.json"; fi
              echo "flags=$flags" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Prepare and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BULTEN_PROVIDER: ${{ vars.BULTEN_PROVIDER }}
          BULTEN_GEMINI_MODEL: ${{ vars.BULTEN_GEMINI_MODEL }}
          BULTEN_MODEL: ${{ vars.BULTEN_MODEL }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          if [ "${{ inputs.check }}" = "true" ]; then
            python -m bulten check
          else
            python -m bulten run --edition ${{ steps.pick.outputs.edition }} ${{ steps.pick.outputs.flags }}
          fi

      - name: Save state
        if: always()
        run: |
          git config user.name "bugun-samsun-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -q -m "bülten: ${{ steps.pick.outputs.edition }} $(TZ=Europe/Istanbul date +%F)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi

      - name: Keep slides, caption and research notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulten-${{ steps.pick.outputs.edition }}-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
