name: Bugün Samsun

on:
  # No GitHub cron here: in this repository it fired hours late (Spor once ran at 01:33 and posted
  # a second bulletin). The Zamanlayıcı workflow starts the bulletins instead (wait=true).
  workflow_dispatch:
    inputs:
      edition:
        description: "Bülten"
        type: choice
        options: [gundem, ekonomi, spor, reels]
        default: gundem
      publish:
        description: "Instagram'a gönder (kapalıysa yalnızca görselleri hazırlar)"
        type: boolean
        default: false
      force:
        description: "Bugün zaten yayınlandıysa yine de gönder"
        type: boolean
        default: false
      wait:
        description: "Yayın saatini bekle (zamanlayıcı kullanır)"
        type: boolean
        default: false
      sample:
        description: "Şablon testi: örnek içerikle görsel üret (yapay zekâ ve yayın yok)"
        type: boolean
        default: false
      check:
        description: "Bağlantı kontrolü: Instagram ve yapay zekâ anahtarlarını dene (hiçbir şey yayınlamaz)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # restart the timer if its chain ever breaks
  issues: write    # failure alerts (an issue mentioning the owner sends an e-mail)

concurrency:
  group: bugun-samsun
  cancel-in-progress: false

jobs:
  bulletin:
    if: github.event_name == 'workflow_dispatch'  # a stale scheduled event from the old cron must do nothing
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest state, not the commit this run was queued on (a queued backup must see the earlier post)

      - name: Choose edition
        id: pick
        run: |
          echo "edition=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
          flags=""
          if [ "${{ inputs.publish }}" = "true" ]; then flags="--publish"; fi
          if [ "${{ inputs.force }}" = "true" ]; then flags="$flags --force"; fi
          if [ "${{ inputs.wait }}" = "true" ]; then flags="$flags --wait"; fi
          if [ "${{ inputs.sample }}" = "true" ]; then
            src="${{ inputs.edition }}"; [ "$src" = "reels" ] && src="gundem"  # the Reels is made from a Gündem issue
            flags="--issue samples/$src.json"
          fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Prepare and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BULTEN_PROVIDER: ${{ vars.BULTEN_PROVIDER }}
          BULTEN_REELS_TRIAL: ${{ vars.BULTEN_REELS_TRIAL }}
          BULTEN_GEMINI_MODEL: ${{ vars.BULTEN_GEMINI_MODEL }}
          BULTEN_MODEL: ${{ vars.BULTEN_MODEL }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          if [ "${{ inputs.check }}" = "true" ]; then
            python -m bulten check
          else
            python -m bulten run --edition ${{ steps.pick.outputs.edition }} ${{ steps.pick.outputs.flags }}
          fi

      - name: Save state
        if: always()
        run: |
          git config user.name "bugun-samsun-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -q -m "bülten: ${{ steps.pick.outputs.edition }} $(TZ=Europe/Istanbul date +%F)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi

      - name: Keep slides, caption and research notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulten-${{ steps.pick.outputs.edition }}-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the timer running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list -R "$GITHUB_REPOSITORY" --workflow zamanlayici.yml -L 20 --json status \
                   --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" = "0" ]; then
            gh workflow run zamanlayici.yml -R "$GITHUB_REPOSITORY" && echo "Zamanlayıcı çalışmıyordu, yeniden başlatıldı."
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Bülten hata verdi: ${{ steps.pick.outputs.edition }} $(TZ=Europe/Istanbul date '+%d.%m %H:%M')" \
            --body "@${{ github.repository_owner }} çalıştırma başarısız oldu. Ayrıntı: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
