name: Zamanlama testi
# Temporary probe: does GitHub fire scheduled events for this repository at all?
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "schedule fired ${{ github.event.schedule }} at $(TZ=Europe/Istanbul date)"
